  description: >-
    A suite of interactive web-based data tools providing access to BJS statistical data on crime, corrections,
    courts, law enforcement, and victimization. Tools include LEARCAT (law enforcement agency crime data),
    Recidivism Patterns Explorer, Federal Criminal Case Processing Statistics, and NCVS Dashboard.
  features:
  - Law Enforcement Crime Data (LEARCAT)
  - Recidivism Analysis
  - Federal Criminal Case Processing
  - Corrections Statistical Analysis
  - Justice Expenditure Data
  - Parole and Probation Dashboards
  useCases:
  - Criminal justice research
  - Recidivism policy analysis
  - Justice system spending analysis
  - Interactive data exploration
